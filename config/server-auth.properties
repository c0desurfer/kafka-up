# kafka-up --auth: 4-listener KRaft broker with SASL/SCRAM + SASL_SSL.
#
# Mounted into the apache/kafka container at
# /mnt/shared/config/server.properties via compose.auth.override.yml.
# When this file is present at startup, the apache/kafka image entry
# point uses it directly and ignores the env-var-driven config from
# compose.yml.
#
# Each external (host-facing) listener has a sibling INT_* listener
# advertised under the in-network hostname, so sidecars (Schema
# Registry, Connect, Kafbat, Apicurio) can follow metadata back to
# the broker through the compose network instead of trying to resolve
# "localhost" inside their own container.
#
# CONTROLLER (9090)          raft, internal only
# INTERNAL (29092)           PLAINTEXT for sidecars
# PLAINTEXT (9092)           host: default, no auth
# SASL_256 / INT_SASL_256    SCRAM-SHA-256  (9093 host / 29093 in-net)
# SASL_512 / INT_SASL_512    SCRAM-SHA-512  (9094 host / 29094 in-net)
# SASL_SSL / INT_SASL_SSL    SASL_SSL/SCRAM-512 (9095 host / 29095 in-net)

# ---- KRaft ----
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka0:9090
controller.listener.names=CONTROLLER

# ---- Listeners ----
listeners=CONTROLLER://:9090,INTERNAL://:29092,PLAINTEXT://:9092,SASL_256://:9093,SASL_512://:9094,SASL_SSL://:9095,INT_SASL_256://:29093,INT_SASL_512://:29094,INT_SASL_SSL://:29095
advertised.listeners=INTERNAL://kafka0:29092,PLAINTEXT://localhost:9092,SASL_256://localhost:9093,SASL_512://localhost:9094,SASL_SSL://localhost:9095,INT_SASL_256://kafka0:29093,INT_SASL_512://kafka0:29094,INT_SASL_SSL://kafka0:29095
listener.security.protocol.map=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_256:SASL_PLAINTEXT,SASL_512:SASL_PLAINTEXT,SASL_SSL:SASL_SSL,INT_SASL_256:SASL_PLAINTEXT,INT_SASL_512:SASL_PLAINTEXT,INT_SASL_SSL:SASL_SSL
inter.broker.listener.name=INTERNAL

# ---- SASL: SCRAM-SHA-256 (host on 9093, in-net on 29093) ----
listener.name.sasl_256.sasl.enabled.mechanisms=SCRAM-SHA-256
listener.name.sasl_256.scram-sha-256.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.int_sasl_256.sasl.enabled.mechanisms=SCRAM-SHA-256
listener.name.int_sasl_256.scram-sha-256.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;

# ---- SASL: SCRAM-SHA-512 (host on 9094, in-net on 29094) ----
listener.name.sasl_512.sasl.enabled.mechanisms=SCRAM-SHA-512
listener.name.sasl_512.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.int_sasl_512.sasl.enabled.mechanisms=SCRAM-SHA-512
listener.name.int_sasl_512.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;

# ---- SASL_SSL: SCRAM-SHA-512 over TLS (host on 9095, in-net on 29095) ----
listener.name.sasl_ssl.sasl.enabled.mechanisms=SCRAM-SHA-512
listener.name.sasl_ssl.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.sasl_ssl.ssl.client.auth=none
listener.name.sasl_ssl.ssl.keystore.type=PEM
listener.name.sasl_ssl.ssl.keystore.location=/etc/kafka/secrets/server.pem
listener.name.sasl_ssl.ssl.endpoint.identification.algorithm=
listener.name.int_sasl_ssl.sasl.enabled.mechanisms=SCRAM-SHA-512
listener.name.int_sasl_ssl.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.int_sasl_ssl.ssl.client.auth=none
listener.name.int_sasl_ssl.ssl.keystore.type=PEM
listener.name.int_sasl_ssl.ssl.keystore.location=/etc/kafka/secrets/server.pem
listener.name.int_sasl_ssl.ssl.endpoint.identification.algorithm=

# ---- Single-node defaults ----
num.partitions=3
default.replication.factor=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
min.insync.replicas=1
group.initial.rebalance.delay.ms=0
auto.create.topics.enable=false

# ---- Storage ----
log.dirs=/var/lib/kafka/data
