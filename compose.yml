name: kafka-up

# kafka-up local Kafka environment.
#
# Drive this through the ./kafka-up script. The script picks the right
# compose profiles, derives the per-broker bootstrap string, sets the
# replication factor, and waits for readiness. Calling podman compose
# directly works too, but you'll set the env vars and profiles yourself.
#
# Profiles:
#   single   one combined broker+controller node (default)
#   cluster  three combined broker+controller nodes
#   connect  Kafka Connect worker (distributed, single node)
#   ui       Kafbat web UI
#
# Everything binds to 127.0.0.1 so the cluster is never exposed beyond
# the host.

x-broker-common: &broker-common
  image: apache/kafka:4.3.0
  restart: unless-stopped
  healthcheck:
    test:
      - CMD-SHELL
      - "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
    interval: 3s
    timeout: 5s
    retries: 20
    start_period: 5s

x-broker-env: &broker-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: "-Xmx768m -Xms512m"
  CLUSTER_ID: "${CLUSTER_ID:-kafka-up-fcSL6g3nShTeMCtK}"

services:
  kafka0:
    <<: *broker-common
    container_name: kafka-up-kafka0
    hostname: kafka0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "${KAFKA_UP_QUORUM_VOTERS:-1@kafka0:9090}"
      KAFKA_LISTENERS: "CONTROLLER://:9090,INTERNAL://:29092,PLAINTEXT://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka0:29092,PLAINTEXT://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "${KAFKA_UP_RF:-1}"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "${KAFKA_UP_RF:-1}"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "${KAFKA_UP_MIN_ISR:-1}"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "${KAFKA_UP_RF:-1}"
      KAFKA_MIN_INSYNC_REPLICAS: "${KAFKA_UP_MIN_ISR:-1}"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "${KAFKA_UP_RF:-1}"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "${KAFKA_UP_MIN_ISR:-1}"
    volumes:
      - kafka0-data:/var/lib/kafka/data

  kafka1:
    <<: *broker-common
    profiles: ["cluster"]
    container_name: kafka-up-kafka1
    hostname: kafka1
    ports:
      - "127.0.0.1:9192:9192"
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka0:9090,2@kafka1:9090,3@kafka2:9090"
      KAFKA_LISTENERS: "CONTROLLER://:9090,INTERNAL://:29092,PLAINTEXT://:9192"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka1:29092,PLAINTEXT://localhost:9192"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
    healthcheck:
      test:
        - CMD-SHELL
        - "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9192 >/dev/null 2>&1"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    <<: *broker-common
    profiles: ["cluster"]
    container_name: kafka-up-kafka2
    hostname: kafka2
    ports:
      - "127.0.0.1:9292:9292"
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka0:9090,2@kafka1:9090,3@kafka2:9090"
      KAFKA_LISTENERS: "CONTROLLER://:9090,INTERNAL://:29092,PLAINTEXT://:9292"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka2:29092,PLAINTEXT://localhost:9292"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
    healthcheck:
      test:
        - CMD-SHELL
        - "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9292 >/dev/null 2>&1"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - kafka2-data:/var/lib/kafka/data

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.7
    container_name: kafka-up-schema-registry
    hostname: schema-registry
    restart: unless-stopped
    depends_on:
      kafka0:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "${KAFKA_UP_BOOTSTRAP_INTERNAL:-PLAINTEXT://kafka0:29092}"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: "${KAFKA_UP_RF:-1}"
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
      SCHEMA_REGISTRY_DEBUG: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  connect:
    image: confluentinc/cp-kafka-connect:7.9.7
    container_name: kafka-up-connect
    hostname: connect
    restart: unless-stopped
    depends_on:
      kafka0:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "${KAFKA_UP_BOOTSTRAP_INTERNAL_PLAIN:-kafka0:29092}"
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: kafka-up-connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "${KAFKA_UP_RF:-1}"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "${KAFKA_UP_RF:-1}"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "${KAFKA_UP_RF:-1}"
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      CONNECT_LOG4J_ROOT_LOGLEVEL: WARN
      CONNECT_LOG4J_LOGGERS: "org.reflections=ERROR,org.apache.kafka.connect=INFO"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 10s

  ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kafka-up-ui
    hostname: ui
    restart: unless-stopped
    depends_on:
      kafka0:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: "${KAFKA_UP_CLUSTER_NAME:-kafka-up}"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "${KAFKA_UP_BOOTSTRAP_INTERNAL_PLAIN:-kafka0:29092}"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8081"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: "http://connect:8083"
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_IO_KAFBAT: INFO

volumes:
  kafka0-data:
    name: kafka-up-kafka0-data
  kafka1-data:
    name: kafka-up-kafka1-data
  kafka2-data:
    name: kafka-up-kafka2-data
