name: e2e

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly run catches breakage from upstream images even when nothing
    # in the repo has changed.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  bring-up:
    name: ${{ matrix.mode }} mode
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [single, cluster]
    steps:
      - uses: actions/checkout@v4

      - name: Bring up the cluster
        env:
          KAFKA_UP_ENGINE: docker
          NO_COLOR: "1"
        run: |
          set -o pipefail
          if [ "${{ matrix.mode }}" = "cluster" ]; then
            ./kafka-up --engine docker --brokers 3 2>&1 | tee /tmp/kafka-up.out
          else
            ./kafka-up --engine docker 2>&1 | tee /tmp/kafka-up.out
          fi

      - name: Echo kafka-up output to summary
        if: always()
        run: |
          {
            echo "### kafka-up output (${{ matrix.mode }} mode)"
            echo
            echo '```text'
            cat /tmp/kafka-up.out 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: List topics
        run: |
          docker exec kafka-up-kafka0 \
            /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 --list

      - name: Produce and consume a test message
        run: |
          set -euo pipefail
          docker exec kafka-up-kafka0 \
            /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create --if-not-exists \
            --topic ci.smoke --partitions 3 --replication-factor 1
          msg='{"ci":"hello","ts":"'"$(date -Iseconds)"'"}'
          echo "$msg" | docker exec -i kafka-up-kafka0 \
            /opt/kafka/bin/kafka-console-producer.sh \
            --bootstrap-server localhost:9092 --topic ci.smoke
          got=$(docker exec kafka-up-kafka0 \
            /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 --topic ci.smoke \
            --from-beginning --max-messages 1 --timeout-ms 15000)
          echo "got: $got"
          test "$got" = "$msg"

      - name: Schema Registry round-trip
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8081/subjects
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data '{"schema":"{\"type\":\"record\",\"name\":\"Hello\",\"fields\":[{\"name\":\"id\",\"type\":\"string\"}]}"}' \
            http://localhost:8081/subjects/ci-smoke-value/versions
          curl -fsS http://localhost:8081/subjects/ci-smoke-value/versions/latest

      - name: Connect health
        run: |
          curl -fsS http://localhost:8083/ | tee /tmp/connect.json
          # Empty list is fine, we just verify the API answers.
          curl -fsS http://localhost:8083/connectors

      - name: kafka-status snapshot
        run: ./kafka-status

      - name: Dump logs on failure
        if: failure()
        run: |
          # Always emit to the job summary so the failure is readable
          # without log-API auth on a public repo.
          {
            echo "### Container state (${{ matrix.mode }} mode)"
            echo
            echo '```'
            docker ps -a --filter name=kafka-up- --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
            echo '```'
            for c in $(docker ps -a --filter name=kafka-up- --format '{{.Names}}'); do
              echo
              echo "<details><summary><code>$c</code> last 200 log lines</summary>"
              echo
              echo '```'
              docker logs --tail 200 "$c" 2>&1 || true
              echo '```'
              echo
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          # Also dump to stdout so the workflow logs have it too.
          for c in $(docker ps -a --filter name=kafka-up- --format '{{.Names}}'); do
            echo "::group::$c"
            docker logs --tail 200 "$c" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        run: ./kafka-reset --yes || true
