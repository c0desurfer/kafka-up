name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          scandir: .
          additional_files: kafka-up kafka-down kafka-reset kafka-status kafka-logs

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pipx install yamllint
      - name: Run yamllint
        run: yamllint -s -c .yamllint.yml .

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_on_error: true

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !node_modules

  no-em-dashes:
    name: no em-dashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for em-dash and en-dash in user-facing files
        run: |
          set -euo pipefail
          # Em-dash and en-dash read as AI-generated. Reject in README,
          # compose, and scripts. Internal markdown under docs/ is exempt.
          if grep -nP '[\xe2\x80\x93\xe2\x80\x94]' \
              README.md compose.yml \
              kafka-up kafka-down kafka-reset kafka-status kafka-logs \
              scripts/*.sh 2>/dev/null; then
            echo "::error::found em-dash or en-dash in user-facing files"
            exit 1
          fi
